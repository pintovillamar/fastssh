[package]
name = "fastssh-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = "0.64.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
